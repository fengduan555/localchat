<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>艾莉 · 本地语音聊天</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: system-ui,-apple-system,"Microsoft YaHei",sans-serif;
         color:#f0f2f6; height:100vh; display:flex; background:#0b0d12; overflow:hidden; }

  /* 背景海报 + 虚化 + 暗化，保证正文可读 */
  body::before {
    content:''; position:fixed; inset:-30px; z-index:-2;
    background: var(--bg-img, url('/assets/poster.jpg')) center 30% / cover no-repeat;
    filter: blur(var(--bg-blur, 20px)) brightness(var(--bg-dim, .46)) saturate(1.08);
    transform: scale(1.08);
  }
  /* 叠加一层渐变，让中间亮、四周暗（电影感） */
  body::after {
    content:''; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 28% 18%, rgba(120,170,255,.16), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse at 70% 90%, rgba(255,150,190,.10), rgba(0,0,0,0) 55%),
      linear-gradient(180deg, rgba(8,10,16,.55), rgba(6,8,13,.82));
  }

  /* 左侧栏做成悬浮圆角卡片 */
  #side { width:330px; margin:10px 0 10px 10px; padding:46px 14px 14px; overflow-y:auto;
          border:1px solid rgba(255,255,255,.12); border-radius:20px;
          background:rgba(16,20,28,.62); backdrop-filter:blur(20px) saturate(1.12);
          box-shadow:0 12px 36px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.07);
          transition: width .26s cubic-bezier(.4,0,.2,1), padding .26s ease, opacity .18s ease,
                      margin .26s ease, border-radius .26s ease; }
  #side::-webkit-scrollbar { width:6px; }
  #side::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:6px; }
  body.collapsed #side { width:0; margin-left:0; margin-right:0; padding:0; opacity:0;
          border:0; border-radius:0; pointer-events:none; overflow:hidden; }
  #toggleSide { position:fixed; top:16px; left:20px; z-index:60; width:34px; height:34px; margin:0; padding:0;
          transition:left .26s cubic-bezier(.4,0,.2,1), background .15s, transform .15s;
          border-radius:10px; background:rgba(20,24,33,.72); backdrop-filter:blur(12px);
          border:1px solid rgba(255,255,255,.18); color:#e3e9f5; font-size:15px; line-height:1;
          box-shadow:0 3px 12px rgba(0,0,0,.28); cursor:pointer; }
  body.collapsed #toggleSide { left:10px; }
  #toggleSide:hover { background:rgba(58,90,180,.65); transform:scale(1.06); }
  body.collapsed #main { padding-left:0; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }

  h3 { font-size:12px; color:#9fb0cc; margin:16px 0 6px; text-transform:uppercase; letter-spacing:1px;
       display:flex; align-items:center; gap:6px; }
  h3::before { content:''; width:3px; height:12px; border-radius:2px;
       background:linear-gradient(180deg,#7fb0ff,#c78bff); }
  label { font-size:12px; color:#9aa7bd; display:block; margin-top:9px; }
  input,select,textarea { width:100%; padding:8px 10px; margin-top:3px;
         background:rgba(8,11,17,.66); border:1px solid rgba(255,255,255,.14); border-radius:9px;
         color:#eef2f8; font-size:13px; font-family:inherit; backdrop-filter:blur(6px); }
  input:focus,select:focus,textarea:focus { outline:none; border-color:#6f9dff;
         box-shadow:0 0 0 3px rgba(90,140,255,.18); }
  textarea { resize:vertical; min-height:66px; }
  button { padding:9px 12px; background:linear-gradient(135deg,#3b6ef5,#6a8dff); border:0;
         border-radius:10px; color:#fff; font-size:13px; cursor:pointer; margin-top:11px;
         box-shadow:0 4px 14px rgba(60,110,245,.28); }
  button.ghost { background:rgba(255,255,255,.10); box-shadow:none; border:1px solid rgba(255,255,255,.14); }
  button:hover { filter:brightness(1.12); }

  #chat { flex:1; overflow-y:auto; padding:22px 26px;
          display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  /* 气泡宽度跟随文字长度: flex 子项按内容收缩, 上限 76%; 长文本自动换行不断词 */
  .msg { max-width:76%; width:fit-content; line-height:1.65; font-size:14px;
         white-space:pre-wrap; overflow-wrap:anywhere;
         box-shadow:0 6px 22px rgba(0,0,0,.28); }
  .me { align-self:flex-end; padding:10px 14px; border-radius:14px 14px 4px 14px;
        background:linear-gradient(135deg,#2b5cff,#5b8cff); }
  .ai { align-self:flex-start; padding:10px 14px; border-radius:14px 14px 14px 4px;
        background:rgba(24,29,39,.72); border:1px solid rgba(255,255,255,.10);
        backdrop-filter:blur(10px); }
  .meta { font-size:11px; color:#8f9cb3; margin-top:5px; }

  #bar { padding:12px 18px; display:flex; gap:10px;
         border-top:1px solid rgba(255,255,255,.10);
         background:rgba(12,15,21,.66); backdrop-filter:blur(16px); }
  #bar input { margin:0; }
  #send { margin:0; padding:9px 20px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .bar { height:7px; border-radius:4px; background:rgba(255,255,255,.12); margin:3px 0 7px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:4px;
             background:linear-gradient(90deg,#ff8fb1,#ffd479); }
  .bar.trust > i { background:linear-gradient(90deg,#7fb0ff,#8be0c8); }
  /* 侧栏: 竖向按钮列表 + 一次只显示一个面板 */
  #panelNav { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .navbtn { width:100%; display:flex; align-items:center; justify-content:center; text-align:center;
            margin:0; padding:8px 11px; font-size:13px; line-height:1.25;
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
            border-radius:9px; color:#cfd8e8; box-shadow:none;
            transition:background .15s, transform .1s; }
  .navbtn:hover { background:rgba(255,255,255,.14); }
  .navbtn:active { transform:scale(.99); }
  .navbtn.active { background:linear-gradient(135deg,#3b6ef5,#6a8dff); color:#fff;
                   border-color:transparent; box-shadow:0 3px 12px rgba(60,110,245,.35); }
  .navbtn .hint { margin-left:auto; font-size:11px; opacity:.65; font-weight:400; }
  .panel { display:none; }
  .panel.active { display:block; animation:fadein .16s ease; }
  @keyframes fadein { from{opacity:0;transform:translateY(-3px)} to{opacity:1;transform:none} }
  #side h3 { display:none; }        /* 面板名已由按钮表达, 标题不再重复 */
  .memItem { padding:5px 7px; margin:3px 0; border-radius:7px;
             background:rgba(255,255,255,.06); display:flex; gap:6px; align-items:start; }
  .memItem .k { color:#ffd479; }
  .memItem .del, .memItem .pin { cursor:pointer; opacity:.5; font-size:11px; }
  .memItem .del:hover, .memItem .pin:hover { opacity:1; }
  .memItem { padding:5px 7px; margin:3px 0; border-radius:7px;
             background:rgba(255,255,255,.06); display:flex; gap:6px; align-items:start; }
  .memItem .k { color:#ffd479; }
  .memItem .del, .memItem .pin { cursor:pointer; opacity:.5; font-size:11px; }
  .memItem .del:hover, .memItem .pin:hover { opacity:1; }
  #status { font-size:11px; color:#93a1b8; padding:7px 26px;
            background:rgba(10,13,19,.5); backdrop-filter:blur(10px); }
  ::-webkit-scrollbar { width:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.16); border-radius:9px; }

  /* 居中确认弹窗 (替代浏览器原生 confirm) */
  #confirmMask { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
                 background:rgba(6,8,13,.52); backdrop-filter:blur(4px);
                 opacity:0; pointer-events:none; transition:opacity .16s ease; }
  #confirmMask.show { opacity:1; pointer-events:auto; }
  #confirmBox { width:min(360px, calc(100vw - 48px)); padding:20px 20px 16px; border-radius:16px;
                background:rgba(21,26,36,.94); backdrop-filter:blur(20px) saturate(1.12);
                border:1px solid rgba(255,255,255,.14);
                box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
                transform:translateY(8px) scale(.97);
                transition:transform .18s cubic-bezier(.4,0,.2,1); }
  #confirmMask.show #confirmBox { transform:none; }
  #confirmText { font-size:13.5px; line-height:1.65; color:#e7edf7; text-align:center; margin-bottom:16px; }
  #confirmBtns { display:flex; gap:10px; }
  #confirmBtns button { flex:1; margin-top:0; }
</style>
</head>
<body>
<button id="toggleSide" title="收起/展开左侧栏  (Ctrl+B)">&laquo;</button>
<div id="side">
  <div id="panelNav">
    <button class="navbtn" data-panel="voice">语音设置</button>
    <button class="navbtn" data-panel="sess">会话</button>
    <button class="navbtn" data-panel="rel">关系</button>
    <button class="navbtn" data-panel="mem">记忆</button>
    <button class="navbtn" data-panel="llm">LLM</button>
    <button class="navbtn" data-panel="svc">服务</button>
    <button class="navbtn" data-panel="look">外观</button>
  </div>

  <div class="panel" id="p-voice">
  <label>音色模型（RVC）</label>
  <select id="model"></select>
  <div class="row">
    <div><label>音色</label><select id="voice">
      <option value="airi">airi（中文）</option>
      <option value="airi_zh">airi_zh</option>
      <option value="airi_en">airi_en（英语）</option>
    </select></div>
  </div>
  <label>语速 <span id="speedv">1.00</span></label>
  <input type="range" id="speed" min="0.6" max="1.6" step="0.05" value="1">
  <label>索引倍率（压电音，0=关）<span id="idxv">0.00</span></label>
  <input type="range" id="idx" min="0" max="0.7" step="0.05" value="0">
  <button id="saveTts">保存语音设置</button>
  <button class="ghost" id="testTts">试听这句话</button>
  </div>

  <div class="panel" id="p-sess">
  <div class="row">
    <select id="sessList"></select>
    <button class="ghost" id="sessNew" style="flex:0 0 auto">新会话</button>
  </div>
  <div class="row">
    <button class="ghost" id="sessRename">重命名</button>
    <button class="ghost" id="sessDelete">删除</button>
  </div>
  </div>

  <div class="panel" id="p-rel">
  <div id="relBox" style="font-size:12px"></div>
  <button class="ghost" id="relReset" style="margin-top:6px">重置关系</button>
  </div>

  <div class="panel" id="p-mem">
  <div id="memList" style="max-height:300px;overflow-y:auto;font-size:12px"></div>
  <div class="row" style="margin-top:6px">
    <input id="memKey" placeholder="键（如 用户称呼）">
    <input id="memVal" placeholder="值（如 小风）">
  </div>
  <div class="row">
    <select id="memCat"></select>
    <button class="ghost" id="memAdd" style="flex:0 0 auto">记住</button>
  </div>
  <div class="row">
    <button class="ghost" id="memExport">导出记忆</button>
    <button class="ghost" id="memClear">清空事实</button>
  </div>
  </div>

  <div class="panel" id="p-llm">
  <label>Base URL（到 /v1 为止）</label>
  <input id="baseUrl" placeholder="https://api.xxx.com/v1">
  <label>API Key</label>
  <input id="apiKey" type="password" placeholder="sk-...">
  <label>模型名</label>
  <input id="modelName" placeholder="deepseek-chat / gpt-4o-mini ...">
  <label>记忆/摘要模型 <span style="opacity:.6">（勿用推理模型）</span></label>
  <input id="memModel" placeholder="deepseek-chat">
  <label>人设（System Prompt）</label>
  <textarea id="sysPrompt"></textarea>
  <div class="row">
    <div><label>温度</label><input id="temp" type="number" step="0.05" min="0" max="2"></div>
    <div><label>最大长度</label><input id="maxTok" type="number" step="50" min="50"></div>
  </div>
  <button id="saveLlm">保存 LLM 设置</button>
  </div>

  <div class="panel" id="p-svc">
  <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
    <input type="checkbox" id="autostop" style="width:auto;margin:0">
    <span>关闭网页后自动停止服务</span>
  </label>
  <label>宽限 <span id="gracev">20</span> 秒（刷新不会误停）</label>
  <input type="range" id="grace" min="5" max="120" step="5" value="20">
  </div>

  <div class="panel" id="p-look">
  <label>背景图</label>
  <select id="bgpick">
    <option value="/assets/poster.jpg">海报（竖版）</option>
    <option value="/assets/cover.jpg">剧照（宽幅）</option>
  </select>
  <label>虚化强度 <span id="blurv">20</span> px</label>
  <input type="range" id="blur" min="0" max="45" step="1" value="20">
  <label>背景亮度 <span id="dimv">0.46</span></label>
  <input type="range" id="dim" min="0.2" max="1" step="0.02" value="0.46">
  </div>
</div>

<div id="main">
  <div id="chat"></div>
  <div id="status">就绪</div>

  <div id="bar">
    <input id="input" placeholder="说点什么…（Enter 发送）">
    <button id="send">发送</button>
  </div>
</div>

<div id="confirmMask">
  <div id="confirmBox" role="dialog" aria-modal="true">
    <div id="confirmText"></div>
    <div id="confirmBtns">
      <button id="confirmCancel" class="ghost">取消</button>
      <button id="confirmOk">确定</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* 居中确认弹窗: await askConfirm('...') -> true/false (替代原生 confirm) */
function askConfirm(msg) {
  return new Promise(resolve => {
    const mask = $('confirmMask');
    $('confirmText').textContent = msg;
    mask.classList.add('show');
    let settled = false;
    const done = ok => {
      if (settled) return;
      settled = true;
      mask.classList.remove('show');
      $('confirmOk').onclick = $('confirmCancel').onclick = mask.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      resolve(ok);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); }
    };
    $('confirmOk').onclick = () => done(true);
    $('confirmCancel').onclick = () => done(false);
    mask.onclick = e => { if (e.target === mask) done(false); };
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => $('confirmOk').focus(), 0);
  });
}
let cfg = null, history = [], queue = [], playing = false, player = null, audioUnlocked = false;

async function loadConfig() {
  const r = await fetch('/api/config');
  const d = await r.json();
  cfg = d.config;
  const sel = $('model');
  sel.innerHTML = '';
  (d.models || []).forEach(m => {
    const o = document.createElement('option');
    o.value = m.file; o.textContent = m.file + '  (' + m.size_mb + 'MB)';
    sel.appendChild(o);
  });
  sel.value = cfg.tts.rvc_model || '';
  $('voice').value = cfg.tts.voice || 'airi';
  $('speed').value = cfg.tts.speed; $('speedv').textContent = (+cfg.tts.speed).toFixed(2);
  $('idx').value = cfg.tts.rvc_index_rate; $('idxv').textContent = (+cfg.tts.rvc_index_rate).toFixed(2);
  $('baseUrl').value = cfg.llm.base_url || '';
  $('apiKey').value = cfg.llm.api_key || '';
  $('modelName').value = cfg.llm.model || '';
  $('sysPrompt').value = cfg.llm.system_prompt || '';
  $('memModel').value = (cfg.memory && cfg.memory.model) || '';
  $('temp').value = cfg.llm.temperature; $('maxTok').value = cfg.llm.max_tokens;
  setStatus(cfg.llm.base_url && cfg.llm.model ? '已配置 LLM' : '演示模式（未配置 LLM）');
}

function setStatus(t) { $('status').textContent = t; }

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
  return el;
}

function enqueueAudio(b64) {
  queue.push(b64);
  if (!playing) playNext();
}

/* 播放单个音频: 保留引用 + 挂进 DOM (防 Chrome 把 audio 元素当垃圾回收导致静音/中途断声),
   带看门狗兜底, 播放失败不再静默吞掉而是显示原因。 */
function playAudioUrl(url, onDone) {
  const a = document.createElement('audio');
  a.src = url;
  a.preload = 'auto';
  a.style.display = 'none';
  document.body.appendChild(a);
  player = a;
  let finished = false, wd = 0;
  const arm = ms => { clearTimeout(wd); wd = setTimeout(finish, ms); };
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(wd);
    try { a.pause(); } catch (e) {}
    a.onended = a.onerror = a.ontimeupdate = a.onloadedmetadata = null;
    a.remove();
    if (player === a) player = null;
    URL.revokeObjectURL(url);
    if (onDone) onDone();
  };
  a.onloadedmetadata = () => arm(Math.max(8000, (a.duration || 0) * 1000 + 4000));
  a.ontimeupdate = () => arm(Math.max(8000, ((a.duration || 0) - a.currentTime) * 1000 + 4000));
  a.onended = finish;
  a.onerror = () => { setStatus('音频播放失败（解码错误）'); finish(); };
  arm(12000);
  a.play().then(() => { audioUnlocked = true; }).catch(err => {
    const who = (err && err.name) || '未知';
    setStatus(audioUnlocked ? ('播放出错：' + who)
                            : ('浏览器拦截了自动播放（' + who + '），点一下页面任意处即可继续'));
    const retry = () => a.play().then(() => setStatus('已恢复播放')).catch(() => { setStatus('仍然无法播放：' + who); finish(); });
    document.addEventListener('pointerdown', retry, {once: true});
  });
}

function playNext() {
  if (!queue.length) { playing = false; return; }
  playing = true;
  const b64 = queue.shift();
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  playAudioUrl(URL.createObjectURL(new Blob([buf], {type: 'audio/wav'})), playNext);
}

async function saveTts() {
  await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({tts:{voice:$('voice').value, speed:+$('speed').value,
      rvc_model:$('model').value, rvc_index_rate:+$('idx').value}})});
  setStatus('语音设置已保存：' + $('model').value + ' / ' + $('voice').value);
}
async function saveLlm() {
  await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({llm:{base_url:$('baseUrl').value.trim(), api_key:$('apiKey').value.trim(),
      model:$('modelName').value.trim(), system_prompt:$('sysPrompt').value,
      temperature:+$('temp').value, max_tokens:+$('maxTok').value},
    memory: {model: $('memModel').value.trim()}})});
  setStatus('LLM 设置已保存');
}

async function testTts() {
  setStatus('合成中…');
  const t0 = performance.now();
  const r = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:'你好，我是艾莉。今天也想和你聊聊天。'})});
  if (!r.ok) { setStatus('合成失败：' + (await r.text()).slice(0,120)); return; }
  const wav = await r.arrayBuffer();
  if (!wav.byteLength) { setStatus('合成返回空音频'); return; }
  playAudioUrl(URL.createObjectURL(new Blob([wav], {type:'audio/wav'})));
  setStatus('试听完成，用时 ' + ((performance.now()-t0)/1000).toFixed(2) + ' 秒');
}

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  bubble('me', text);
  const ai = bubble('ai', '');
  let acc = '', t0 = performance.now(), firstAudio = 0;
  const resp = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text, session_id: sessionId})});
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const p of parts) {
      if (!p.startsWith('data:')) continue;
      let ev; try { ev = JSON.parse(p.slice(5).trim()); } catch(e) { continue; }
      if (ev.type === 'delta') { acc += ev.text; ai.textContent = acc; $('chat').scrollTop = $('chat').scrollHeight; }
      else if (ev.type === 'audio') {
        if (!firstAudio) { firstAudio = (performance.now()-t0)/1000; }
        enqueueAudio(ev.audio);
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = '第' + ev.index + '句 · ' + ev.text.slice(0,26) + ' · 合成 ' + ev.elapsed + 's';
        ai.appendChild(m);
      } else if (ev.type === 'session') { sessionId = ev.session_id; }
      else if (ev.type === 'memory') { lastMemHits = ev.count || 0; }
      else if (ev.type === 'error') { setStatus('合成错误：' + ev.text); }
      else if (ev.type === 'done') {
        setStatus('首句出声 ' + firstAudio.toFixed(2) + 's · 总 ' + ev.total + 's'
                  + (lastMemHits ? ' · 命中 ' + lastMemHits + ' 条记忆' : ''));
        setTimeout(() => { loadSessions(sessionId); loadFacts(); loadRelationship(); }, 2000);  // 抽取是异步的
      }
    }
  }
}

function applyLook() {
  const blur = +$('blur').value, dim = +$('dim').value, img = $('bgpick').value;
  document.documentElement.style.setProperty('--bg-img', "url('" + img + "')");
  document.documentElement.style.setProperty('--bg-blur', blur + 'px');
  document.documentElement.style.setProperty('--bg-dim', dim);
  $('blurv').textContent = blur; $('dimv').textContent = dim.toFixed(2);
  localStorage.setItem('airi_look', JSON.stringify({img, blur, dim}));
}
function loadLook() {
  try {
    const v = JSON.parse(localStorage.getItem('airi_look') || '{}');
    if (v.img) $('bgpick').value = v.img;
    if (v.blur !== undefined) $('blur').value = v.blur;
    if (v.dim !== undefined) $('dim').value = v.dim;
  } catch (e) {}
  applyLook();
}
['blur','dim','bgpick'].forEach(id => $(id).addEventListener('input', applyLook));
loadLook();

// ===== 会话 与 记忆 =====
let sessionId = null, lastMemHits = 0;

async function loadSessions(select) {
  const r = await fetch('/api/sessions');
  const d = await r.json();
  const sel = $('sessList');
  sel.innerHTML = '';
  (d.sessions || []).forEach(x => {
    const o = document.createElement('option');
    o.value = x.id;
    const t = new Date(x.updated_at * 1000);
    o.textContent = `${x.title || x.id}  (${x.n}条 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')})`;
    sel.appendChild(o);
  });
  if (select) { sel.value = select; sessionId = select; }
  else if (!sessionId && sel.options.length) { sel.value = sel.options[0].value; sessionId = sel.value; }
}

async function openSession(id) {
  sessionId = id;
  const r = await fetch(`/api/session/${id}/messages`);
  const d = await r.json();
  $('chat').innerHTML = '';
  (d.messages || []).forEach(m => bubble(m.role === 'user' ? 'me' : 'ai', m.content));
  setStatus('已载入会话 ' + ((d.session && d.session.title) || id) + `（${(d.messages||[]).length} 条）`);
}

async function newSession() {
  const r = await fetch('/api/session/new', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  const d = await r.json();
  sessionId = d.session_id;
  $('chat').innerHTML = '';
  await loadSessions(sessionId);
  setStatus('已开启新会话');
}

async function loadFacts() {
  const r = await fetch('/api/memory/facts');
  const d = await r.json();
  const box = $('memList');
  box.innerHTML = '';
  if (!(d.facts || []).length) {
    box.innerHTML = '<div style="opacity:.6">还没有记忆。聊几句会自动积累，也可以手动添加。</div>';
    return;
  }
  d.facts.forEach(f => {
    const el = document.createElement('div');
    el.className = 'memItem';
    el.innerHTML = `<span class="pin" title="置顶">${f.pinned ? '★' : '☆'}</span>`
      + `<span style="flex:1"><span class="k">${f.key}</span>：${f.value}`
      + `<span style="opacity:.5"> · ${f.category}${f.hits ? ' · 命中'+f.hits : ''}</span></span>`
      + `<span class="del" title="删除">✕</span>`;
    el.querySelector('.pin').onclick = async () => {
      await fetch(`/api/memory/facts/${f.id}/pin`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({pinned: !f.pinned})});
      loadFacts();
    };
    el.querySelector('.del').onclick = async () => {
      await fetch(`/api/memory/facts/${f.id}`, {method:'DELETE'});
      loadFacts();
    };
    box.appendChild(el);
  });
}

(function initMemUi() {
  ['身份','偏好','关系','计划','禁忌','梗','其他'].forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; $('memCat').appendChild(o);
  });
})();

$('sessNew').onclick = newSession;
$('sessList').onchange = e => openSession(e.target.value);
$('sessRename').onclick = async () => {
  const cur = $('sessList').selectedOptions[0];
  const t = prompt('会话名称：', cur ? cur.textContent : '');
  if (!t) return;
  await fetch('/api/session/rename', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, title: t})});
  loadSessions(sessionId);
};
$('sessDelete').onclick = async () => {
  if (!sessionId || !(await askConfirm('删除当前会话及其消息？'))) return;
  await fetch(`/api/session/${sessionId}`, {method:'DELETE'});
  sessionId = null;
  await loadSessions();
  $('chat').innerHTML = '';
};
$('memAdd').onclick = async () => {
  const k = $('memKey').value.trim(), v = $('memVal').value.trim();
  if (!k || !v) { setStatus('键和值都要填'); return; }
  await fetch('/api/memory/facts', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:k, value:v, category:$('memCat').value, pinned:true})});
  $('memKey').value = ''; $('memVal').value = '';
  loadFacts(); setStatus('已记住：' + k);
};
$('memExport').onclick = () => { location.href = '/api/memory/export'; };
$('relReset').onclick = async () => {
  if (!(await askConfirm('把好感度/信任/心情重置为初始值？（记忆与会话保留）'))) return;
  await fetch('/api/relationship/reset', {method:'POST'});
  loadRelationship();
};
$('memClear').onclick = async () => {
  if (!(await askConfirm('清空全部事实记忆？（会话记录保留）'))) return;
  await fetch('/api/memory/clear', {method:'POST'});
  loadFacts();
};

async function loadRelationship() {
  const r = await fetch('/api/relationship');
  const d = await r.json();
  const moodTxt = {开心:'😊',兴奋:'🤩',害羞:'😳',平静:'🙂',温柔:'🥰',
                   低落:'😔',寂寞:'🥺',生气:'😠',担心:'😟',撒娇:'😽'}[d.mood] || '🙂';
  const ms = (d.milestones || []).slice(-4)
      .map(m => `<div style="opacity:.75">· ${m.text}</div>`).join('');
  $('relBox').innerHTML =
    `<div style="font-size:15px;margin-bottom:6px">${moodTxt} ${d.mood}
       <span style="opacity:.5;font-size:11px">强度 ${(d.mood_intensity||0).toFixed(1)}</span></div>
     <div>好感度 ${Math.round(d.affinity)}/100</div><div class="bar"><i style="width:${d.affinity}%"></i></div>
     <div>信任 ${Math.round(d.trust)}/100</div><div class="bar trust"><i style="width:${d.trust}%"></i></div>
     <div style="opacity:.75">认识 ${d.days_known} 天 · 见面 ${d.meet_count} 次</div>
     ${ms ? '<div style="margin-top:6px"><span style="opacity:.6">纪念</span>' + ms + '</div>' : ''}
     ${d.note ? `<div style="margin-top:6px;opacity:.7">内心话：${d.note}</div>` : ''}`;
}

async function bootMemory() {
  await loadRelationship();
  await loadSessions();
  if (sessionId) await openSession(sessionId);
  await loadFacts();
}

// ===== 心跳与"关页自动停止" =====
function beat() {
  fetch('/api/heartbeat', {method: 'POST'})
    .then(r => r.json())
    .then(d => {
      if (d && d.auto_stop !== undefined) $('autostop').checked = !!d.auto_stop;
      if (d && d.grace) { $('grace').value = d.grace; $('gracev').textContent = d.grace; }
    })
    .catch(() => {});
}
function saveAutoStop() {
  fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({auto_stop: $('autostop').checked,
                          auto_stop_grace: +$('grace').value})});
}
$('autostop').addEventListener('change', saveAutoStop);
$('grace').addEventListener('input', () => {
  $('gracev').textContent = $('grace').value;
  saveAutoStop();
});

beat();
setInterval(beat, 5000);
// 关页/刷新时通知后端; 刷新会在宽限期内重新发心跳 → 自动取消
window.addEventListener('pagehide', () => {
  try { navigator.sendBeacon('/api/bye'); } catch (e) {}
});
window.addEventListener('beforeunload', () => {
  try { navigator.sendBeacon('/api/bye'); } catch (e) {}
});

// ===== 侧栏面板切换 (一次只显示一个) =====
function showPanel(name) {
  document.querySelectorAll('#panelNav .navbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.panel === name));
  document.querySelectorAll('#side .panel').forEach(p =>
    p.classList.toggle('active', p.id === 'p-' + name));
  localStorage.setItem('airi_panel', name);
}
document.querySelectorAll('#panelNav .navbtn').forEach(b => {
  b.onclick = () => {
    showPanel(b.dataset.panel);
    if (b.dataset.panel === 'rel') loadRelationship();
    if (b.dataset.panel === 'mem') loadFacts();
    if (b.dataset.panel === 'sess') loadSessions(sessionId);
  };
});
showPanel(localStorage.getItem('airi_panel') || 'voice');

function applyCollapse() {
  const c = localStorage.getItem('airi_side_collapsed') === '1';
  document.body.classList.toggle('collapsed', c);
  $('toggleSide').innerHTML = c ? '&raquo;' : '&laquo;';
}
$('toggleSide').onclick = () => {
  const now = document.body.classList.contains('collapsed');
  localStorage.setItem('airi_side_collapsed', now ? '0' : '1');
  applyCollapse();
};
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); $('toggleSide').click(); }
});
applyCollapse();

$('send').onclick = send;
$('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('saveTts').onclick = saveTts;
$('saveLlm').onclick = saveLlm;
$('testTts').onclick = testTts;
$('speed').oninput = e => $('speedv').textContent = (+e.target.value).toFixed(2);
$('idx').oninput = e => $('idxv').textContent = (+e.target.value).toFixed(2);
loadConfig();
bootMemory();
</script>
</body>
</html>
